---
layout: default
---

<div class="fade-in-section page-layout">

<header class="page-grid page-header"> <div class="page-label"> <p class="section-number">{{ page.section_number }}</p> <h1>{{ page.title }}</h1> </div>

<div class="page-content page-intro"> {% if page.subtitle %} <p class="meta">{{ page.subtitle }}</p> {% endif %}

{% if page.intro %} {{ page.intro | markdownify }} {% endif %} </div> </header>

<div class="page-body"> {{ content }} </div>

</div>
